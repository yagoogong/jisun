<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가을 보물 연구소</title>
    <style>
        :root {
            --bg-color: #fdf6ec;
            --main-autumn: #d96b27;
            --main-yellow: #f4b41a;
            --main-green: #48bb78;
            --active-green: #2f855a;
            --main-blue: #3182ce;
            --card-bg: #ffffff;
            --text-dark: #2d3748;
            --accent-orange: #ed8936;
            --shadow-color: rgba(180, 83, 9, 0.15);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(#e2e8f0 1px, transparent 1px),
                radial-gradient(#e2e8f0 1px, #fdf6ec 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Animations */
        @keyframes acornSparkle {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(15deg); }
            70% { transform: scale(0.9) rotate(-5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes bounceGently {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(244, 180, 26, 0.5); }
            50% { box-shadow: 0 0 25px rgba(244, 180, 26, 0.9); }
        }

        .app-container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            background: linear-gradient(135deg, #fffaf0 0%, #feebc8 100%);
            padding: 25px 20px;
            border-radius: 28px;
            border: 4px solid #fbd38d;
            box-shadow: 0 10px 20px var(--shadow-color);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        .title-container {
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            color: var(--main-autumn);
            text-shadow: 2px 2px 0px #ffffff, 4px 4px 0px #feebc8;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #7b341e;
            margin-top: 8px;
            font-weight: bold;
        }

        /* Forest Animals Decorations */
        .decorations {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .decor-item {
            position: absolute;
            font-size: 2.5rem;
            animation: bounceGently 3s infinite ease-in-out;
        }

        .decor-1 { top: 10px; left: 20px; animation-delay: 0s; }
        .decor-2 { top: 15px; right: 20px; animation-delay: 0.5s; }
        .decor-3 { bottom: 5px; left: 15%; animation-delay: 1s; }
        .decor-4 { bottom: 5px; right: 15%; animation-delay: 1.5s; }

        .dashboard {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 30px;
            border: 3px solid #edd6b8;
            box-shadow: 0 8px 16px var(--shadow-color);
        }

        .dashboard-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #7b341e;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
        }

        .stat-card {
            background: #fffaf0;
            border: 2px solid #feebc8;
            padding: 12px 10px;
            border-radius: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .stat-card.highlight {
            background: #feebc8;
            border-color: var(--accent-orange);
            transform: translateY(-2px);
        }

        .stat-icon {
            font-size: 1.8rem;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.95rem;
            color: #4a5568;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--main-autumn);
        }

        /* Reset Button */
        .reset-btn {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(229, 62, 62, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reset-btn:active {
            transform: scale(0.95);
            box-shadow: none;
        }

        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 25px;
            width: 100%;
        }

        .team-card {
            background: var(--card-bg);
            border-radius: 28px;
            border: 4px solid #e2e8f0;
            padding: 22px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .team-card.is-active {
            border-color: var(--main-green);
            box-shadow: 0 12px 20px rgba(72, 187, 120, 0.2);
        }

        .team-card.is-completed {
            border-color: var(--main-yellow);
            background: linear-gradient(180deg, #ffffff 0%, #fffdfa 100%);
            animation: pulseGlow 2.5s infinite ease-in-out;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px dashed #edf2f7;
            padding-bottom: 12px;
        }

        .pair-names {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Acorn Badge */
        .acorn-sticker {
            display: none;
            background: #feebc8;
            border: 2px solid var(--main-yellow);
            border-radius: 50px;
            padding: 4px 12px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #7b341e;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(244, 180, 26, 0.4);
        }

        .team-card.is-completed .acorn-sticker {
            display: inline-flex;
            animation: acornSparkle 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Start Button */
        .start-btn {
            width: 100%;
            padding: 16px;
            font-size: 1.4rem;
            font-weight: 900;
            color: white;
            background: #cbd5e0;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 5px 0 #a0aec0;
            transition: all 0.2s ease;
            margin-bottom: 18px;
        }

        .start-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #a0aec0;
        }

        .team-card.is-active .start-btn {
            background: var(--main-green);
            box-shadow: 0 5px 0 var(--active-green);
        }

        .team-card.is-active .start-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--active-green);
        }

        .activities-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            opacity: 0.5;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .team-card.is-active .activities-grid {
            opacity: 1;
            pointer-events: auto;
        }

        .act-btn {
            background: #f7fafc;
            border: 2.5px solid #e2e8f0;
            border-radius: 16px;
            padding: 14px 10px;
            font-size: 1.15rem;
            font-weight: bold;
            color: #4a5568;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 85px;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 3px 0 #cbd5e0;
        }

        .act-btn .act-icon {
            font-size: 1.6rem;
        }

        .act-btn .status-text {
            font-size: 0.85rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: #edf2f7;
            color: #718096;
            margin-top: 2px;
        }

        /* Activity Completed State */
        .act-btn.completed {
            background: #ebf8ff;
            border-color: var(--main-blue);
            color: #2b6cb0;
            box-shadow: 0 3px 0 #3182ce;
        }

        .act-btn.completed .status-text {
            background: #3182ce;
            color: white;
        }

        .act-btn:active {
            transform: translateY(2px);
            box-shadow: none !important;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 24px;
            border: 4px solid var(--main-autumn);
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.8rem;
            color: var(--main-autumn);
            font-weight: bold;
            margin-bottom: 12px;
        }

        .modal-desc {
            font-size: 1.3rem;
            color: #4a5568;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-btn {
            padding: 12px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 14px;
            border: none;
            cursor: pointer;
        }

        .modal-btn-confirm {
            background: #e53e3e;
            color: white;
        }

        .modal-btn-cancel {
            background: #edf2f7;
            color: #4a5568;
        }

        /* Confetti Effect Container */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* Responsive adjustments for Touch Screens */
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .subtitle { font-size: 1.1rem; }
            .teams-grid { grid-template-columns: 1fr; }
            .stat-card { padding: 8px; }
            .stat-value { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="decorations">
                <span class="decor-item decor-1">🐿️</span>
                <span class="decor-item decor-2">🐰</span>
                <span class="decor-item decor-3">🦌</span>
                <span class="decor-item decor-4">🌰</span>
            </div>
            <div class="title-container">
                <h1>🍁 가을 보물 연구소 🍁</h1>
                <div class="subtitle">가을 보물을 가지고 다양하게 놀이해요</div>
            </div>
        </header>

        <section class="dashboard">
            <div class="dashboard-title">
                <span>📊 학급 연구 현황판</span>
                <button class="reset-btn" id="resetBtn">
                    🔄 전체 초기화
                </button>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">🚀</div>
                    <div class="stat-label">연구 시작 팀</div>
                    <div class="stat-value" id="stat-started">0 / 8</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🏗️</div>
                    <div class="stat-label">도토리 건축가</div>
                    <div class="stat-value" id="stat-act-0">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🍽️</div>
                    <div class="stat-label">다람쥐 밥상</div>
                    <div class="stat-value" id="stat-act-1">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎨</div>
                    <div class="stat-label">나뭇잎 물감</div>
                    <div class="stat-value" id="stat-act-2">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🔔</div>
                    <div class="stat-label">보물 할리갈리</div>
                    <div class="stat-value" id="stat-act-3">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🌀</div>
                    <div class="stat-label">솔방울 미로</div>
                    <div class="stat-value" id="stat-act-4">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💌</div>
                    <div class="stat-label">나무 편지</div>
                    <div class="stat-value" id="stat-act-5">0</div>
                </div>
                <div class="stat-card highlight">
                    <div class="stat-icon">🌰</div>
                    <div class="stat-label">도토리 완성!</div>
                    <div class="stat-value" id="stat-completed">0 / 8</div>
                </div>
            </div>
        </section>

        <main class="teams-grid" id="teamsGrid">
            <!-- Cards will be dynamically created by JS -->
        </main>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-title">⚠️ 전체 초기화</div>
            <div class="modal-desc">
                정말로 모든 팀의 진행 상황과<br>도토리 스티커를 초기화하시겠습니까?
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" id="modalCancel">취소</button>
                <button class="modal-btn modal-btn-confirm" id="modalConfirm">초기화</button>
            </div>
        </div>
    </div>

    <div class="confetti-container" id="confettiContainer"></div>

    <script>
        // Student pairs data
        const teamsData = [
            { id: 1, names: ["박서후", "정서온"] },
            { id: 2, names: ["조하서", "정해인"] },
            { id: 3, names: ["조마영", "김가온"] },
            { id: 4, names: ["박지율", "허은지"] },
            { id: 5, names: ["한서윤", "박수현"] },
            { id: 6, names: ["유수진", "김여울"] },
            { id: 7, names: ["정인우", "박서한"] },
            { id: 8, names: ["한보미", "원서아", "곽지훈"] }
        ];

        // Activity definitions
        const activities = [
            { id: 0, title: "도토리 건축가", icon: "🏗️" },
            { id: 1, title: "다람쥐 밥상 만들기", icon: "🍽️" },
            { id: 2, title: "나뭇잎 물감 찍기", icon: "🎨" },
            { id: 3, title: "가을 보물 할리갈리", icon: "🔔" },
            { id: 4, title: "솔방울 미로 만들기", icon: "🌀" },
            { id: 5, title: "나무에게 보내는 나의 편지", icon: "💌" }
        ];

        // Team status state storage
        // Structure: { [teamId]: { started: boolean, activities: [bool, bool, bool, bool, bool, bool] } }
        let state = {};

        function initData() {
            teamsData.forEach(team => {
                state[team.id] = {
                    started: false,
                    activities: [false, false, false, false, false, false]
                };
            });
        }

        function renderCards() {
            const grid = document.getElementById('teamsGrid');
            grid.innerHTML = '';

            teamsData.forEach(team => {
                const teamState = state[team.id];
                const isAllDone = teamState.activities.every(act => act === true);

                const card = document.createElement('article');
                card.className = `team-card ${teamState.started ? 'is-active' : ''} ${isAllDone ? 'is-completed' : ''}`;
                card.id = `team-card-${team.id}`;

                // Header with Names and Acorn Badge
                const namesText = team.names.join(' & ');
                card.innerHTML = `
                    <div class="card-header">
                        <div class="pair-names">
                            <span>🐿️</span>
                            <span>${namesText} 조</span>
                        </div>
                        <div class="acorn-sticker">
                            🌰✨ 완주!
                        </div>
                    </div>
                    <button class="start-btn" onclick="toggleStart(${team.id})">
                        ${teamState.started ? '▶ 활동 진행 중' : '🚀 활동 시작하기'}
                    </button>
                    <div class="activities-grid">
                        ${activities.map((act, index) => {
                            const isDone = teamState.activities[index];
                            return `
                                <button class="act-btn ${isDone ? 'completed' : ''}" 
                                        onclick="toggleActivity(${team.id}, ${index})"
                                        ${!teamState.started ? 'disabled' : ''}>
                                    <span class="act-icon">${act.icon}</span>
                                    <span>${act.title}</span>
                                    <span class="status-text">${isDone ? '✓ 완료' : '도전하기'}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>
                `;

                grid.appendChild(card);
            });

            updateDashboard();
        }

        function toggleStart(teamId) {
            state[teamId].started = !state[teamId].started;
            // If turning off start, should we keep activities or reset? We keep them, but lock interactions
            renderCards();
        }

        function toggleActivity(teamId, actIndex) {
            if (!state[teamId].started) return;

            const prevDone = state[teamId].activities.every(act => act === true);
            state[teamId].activities[actIndex] = !state[teamId].activities[actIndex];
            const newDone = state[teamId].activities.every(act => act === true);

            // Trigger visual celebration if newly completed all 6
            if (!prevDone && newDone) {
                triggerSparkles();
            }

            renderCards();
        }

        function updateDashboard() {
            let startedCount = 0;
            let actCounts = [0, 0, 0, 0, 0, 0];
            let completedTeamsCount = 0;

            Object.values(state).forEach(tState => {
                if (tState.started) startedCount++;
                
                let teamActCompleted = 0;
                tState.activities.forEach((done, i) => {
                    if (done) {
                        actCounts[i]++;
                        teamActCompleted++;
                    }
                });

                if (teamActCompleted === 6) {
                    completedTeamsCount++;
                }
            });

            // Update UI elements
            document.getElementById('stat-started').innerText = `${startedCount} / ${teamsData.length}`;
            actCounts.forEach((count, idx) => {
                const el = document.getElementById(`stat-act-${idx}`);
                if (el) el.innerText = count;
            });
            document.getElementById('stat-completed').innerText = `${completedTeamsCount} / ${teamsData.length}`;
        }

        function triggerSparkles() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#f4b41a', '#ed8936', '#48bb78', '#3182ce', '#e53e3e'];

            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.innerText = ['🌰', '🍁', '✨', '🍂'][Math.floor(Math.random() * 4)];
                confetti.style.position = 'absolute';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-50px';
                confetti.style.fontSize = (Math.random() * 1.5 + 1.2) + 'rem';
                confetti.style.transition = `all ${Math.random() * 1.5 + 1.5}s cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;

                container.appendChild(confetti);

                setTimeout(() => {
                    confetti.style.top = '100vh';
                    confetti.style.transform = `rotate(${Math.random() * 720}deg) scale(0.5)`;
                    confetti.style.opacity = '0';
                }, 50);

                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }

        const resetBtn = document.getElementById('resetBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalCancel = document.getElementById('modalCancel');
        const modalConfirm = document.getElementById('modalConfirm');

        resetBtn.addEventListener('click', () => {
            modalOverlay.classList.add('active');
        });

        modalCancel.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        modalConfirm.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
            initData();
            renderCards();
        });

        // Initialize App
        window.onload = function() {
            initData();
            renderCards();
        };
    </script>
</body>
</html>
